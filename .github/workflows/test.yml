name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch at a time. A newer push to main replaces main's waiting
# run (the station deploys the newest commit whose run passed), and a newer
# push to a pull request cancels its older run. The account runs five macOS
# jobs at once; on 2026-10-18 eight queued main runs, one per merge, held the
# lane pull requests and the self-deploy for over an hour.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    # macOS: the API-lane tests run the agent under sandbox-exec, which only
    # exists there, and launchd runs the lanes under /bin/bash 3.2.
    runs-on: macos-latest
    # The suite takes 9-10 minutes on a hosted macOS runner (2026-10-14:
    # seven runs at 9.1-9.8, one cancelled at 10), so 10 cancelled main and
    # held the station's self-deploy.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: coreutils timeout
        run: command -v timeout || brew install coreutils
      - name: unittest (no test may skip)
        # bash with pipefail: without it the step's status is tee's, and a
        # failing suite passed CI (the default macOS shell is bash -e only).
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee unittest.out
          # The one opt-in skip: the real-binary test needs LOOM_TEST_OPENCODE2,
          # which CI does not have. Any other skip fails the run.
          if grep -E "\.\.\. skipped " unittest.out | grep -qv "LOOM_TEST_OPENCODE2"; then
            echo "::error::a test skipped; the sandbox tests must run in CI"
            exit 1
          fi
