# The lane pre-PR check: the suite CI runs, the way it runs it
# (.github/workflows/test.yml runs .github/unittest_parallel.py).
# Inside the lane sandbox the tests that need sandbox-exec, ps or a localhost
# port skip (tests/sandbox_caps.py); CI runs them all.
interpreter: python3
check: python3 -B .github/unittest_parallel.py --allow-skips
